name: RaazNet Security Calendar

on:
  schedule:
    # 06:00 and 18:00 UTC — roughly 09:30 and 21:30 Tehran time.
    - cron: "0 6,18 * * *"
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install feedparser pyyaml

      - name: Collect the news
        run: python scripts/collect.py

      - name: Commit today's file
        run: |
          git config user.name  "raaznet-bot"
          git config user.email "action@github.com"
          git add news/
          if git diff --staged --quiet; then
            echo "nothing new to commit"
          else
            git commit -m "news: $(date -u +%Y-%m-%d) automated collection"
            git push
          fi
