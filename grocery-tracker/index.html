<title>Grocery Jar</title>
<meta name="description" content="A cute weekly grocery budget tracker with a $73 cap split across seven categories.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;700;800&display=swap">
<style>
:root{
  --bg:#fff7f1; --card:#ffffff; --ink:#3d3038; --muted:#8c7a84; --line:#f3e3dc;
  --accent:#ff8fab; --accent-ink:#c2446a; --soft:#ffe4ec;
  --ok:#7cc48c; --warn:#f2b955; --bad:#ef6f6c; --track:#f6ebe6;
  --shadow:0 6px 18px rgba(194,68,106,.08);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#2a2230; --card:#352b3c; --ink:#f7eef2; --muted:#b9a7b3; --line:#4a3d51;
    --accent:#ff8fab; --accent-ink:#ffb3c6; --soft:#4a3446;
    --ok:#7cc48c; --warn:#f2b955; --bad:#ef6f6c; --track:#453a4c;
    --shadow:0 6px 18px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  --bg:#2a2230; --card:#352b3c; --ink:#f7eef2; --muted:#b9a7b3; --line:#4a3d51;
  --accent:#ff8fab; --accent-ink:#ffb3c6; --soft:#4a3446;
  --ok:#7cc48c; --warn:#f2b955; --bad:#ef6f6c; --track:#453a4c;
  --shadow:0 6px 18px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,sans-serif;font-size:15px;line-height:1.45}
.wrap{max-width:560px;margin:0 auto;padding-block:20px 48px;padding-inline:16px;display:grid;gap:18px}
h1,h2,h3{font-family:Fredoka,Nunito,system-ui,sans-serif;margin:0;text-wrap:balance}
h1{font-size:2rem;font-weight:700;letter-spacing:.01em}
.hdr{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.hdr p{margin:2px 0 0;color:var(--muted);font-weight:700}
.weeknav{display:flex;align-items:center;gap:6px;background:var(--card);border-radius:999px;padding:4px;box-shadow:var(--shadow)}
.weeknav button{border:0;background:transparent;color:var(--ink);font:inherit;font-weight:800;width:34px;height:34px;border-radius:50%;cursor:pointer}
.weeknav button:hover{background:var(--soft)}
.weeknav span{font-weight:800;font-size:.9rem;min-width:130px;text-align:center}

.total{background:var(--card);border-radius:24px;padding:20px;box-shadow:var(--shadow);display:grid;gap:12px}
.total .row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.big{font-family:Fredoka,sans-serif;font-size:2.6rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.big small{font-size:1.1rem;color:var(--muted);font-weight:600}
.mood{font-size:1rem;font-weight:800;color:var(--accent-ink)}
.bar{height:14px;border-radius:999px;background:var(--track);overflow:hidden;position:relative}
.bar i{display:block;height:100%;border-radius:999px;background:var(--ok);transition:width .35s ease, background .35s}
.bar.warn i{background:var(--warn)} .bar.bad i{background:var(--bad)}
.legend{display:flex;justify-content:space-between;color:var(--muted);font-size:.85rem;font-weight:700}

.cats{display:grid;gap:10px}
.cat{background:var(--card);border-radius:20px;padding:14px 16px;box-shadow:var(--shadow);display:grid;gap:8px}
.cat .top{display:flex;align-items:center;gap:10px}
.cat .ico{font-size:1.5rem;width:40px;height:40px;display:grid;place-items:center;background:var(--soft);border-radius:14px;flex:none}
.cat h3{font-size:1.1rem;font-weight:600;flex:1}
.cat .nums{font-variant-numeric:tabular-nums;font-weight:800;text-align:right;white-space:nowrap}
.cat .nums small{display:block;color:var(--muted);font-size:.78rem;font-weight:700}
.cat .bar{height:9px}
.add{display:flex;gap:6px;align-items:center}
.add .money{position:relative;flex:0 0 96px}
.add .money::before{content:"$";position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted);font-weight:800}
.add input{width:100%;font:inherit;font-weight:700;border:2px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:8px 10px}
.add input.amt{padding-left:22px}
.add input.note{flex:1;min-width:0}
.add input:focus{outline:none;border-color:var(--accent)}
.add button{border:0;background:var(--accent);color:#fff;font:inherit;font-weight:800;border-radius:12px;padding:8px 14px;cursor:pointer;flex:none}
.add button:hover{filter:brightness(1.05)}
.add button:focus-visible,.weeknav button:focus-visible,.chip:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.items{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--soft);color:var(--ink);border:0;border-radius:999px;padding:3px 10px;font:inherit;font-size:.82rem;font-weight:700;cursor:pointer}
.chip b{font-variant-numeric:tabular-nums}
.chip::after{content:"×";color:var(--muted);font-weight:800}
.chip:hover::after{color:var(--bad)}
.over{color:var(--bad)}

.hist{background:var(--card);border-radius:20px;padding:16px;box-shadow:var(--shadow);display:grid;gap:10px}
.hist h2{font-size:1.15rem;font-weight:600}
.hist .streak{color:var(--muted);font-weight:700;font-size:.9rem;margin:0}
.hist ul{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.hist li{display:grid;grid-template-columns:1fr auto 26px;align-items:center;gap:10px;font-weight:700;font-variant-numeric:tabular-nums}
.hist li span:first-child{color:var(--muted);font-size:.9rem}
.hist .empty{color:var(--muted);font-weight:700;margin:0}
.tip{color:var(--muted);font-size:.85rem;text-align:center;font-weight:700;margin:0}
@media (prefers-reduced-motion: reduce){.bar i{transition:none}}
</style>

<div class="wrap">
  <header class="hdr">
    <div>
      <h1>🧺 Grocery Jar</h1>
      <p>$73 a week. That's the whole jar.</p>
    </div>
    <nav class="weeknav" aria-label="Choose week">
      <button id="prevWeek" type="button" aria-label="Previous week">‹</button>
      <span id="weekLabel"></span>
      <button id="nextWeek" type="button" aria-label="Next week">›</button>
    </nav>
  </header>

  <section class="total" aria-live="polite">
    <div class="row">
      <div class="big"><span id="spent">$0</span> <small>of $73</small></div>
      <div class="mood" id="mood"></div>
    </div>
    <div class="bar" id="totalBar"><i style="width:0%"></i></div>
    <div class="legend"><span id="leftText"></span><span id="dayText"></span></div>
  </section>

  <section class="cats" id="cats"></section>

  <section class="hist">
    <h2>🌸 Past weeks</h2>
    <p class="streak" id="streak"></p>
    <ul id="histList"></ul>
    <p class="empty" id="histEmpty">Your first week is underway. Finish it under $73 to start a streak.</p>
  </section>

  <p class="tip">Saved on this device only. Tap a little pill to remove it.</p>
</div>

<script>
const CATS = [
  {id:'protein', name:'Protein',       ico:'🍗', budget:20},
  {id:'carbs',   name:'Carbs',         ico:'🍞', budget:13},
  {id:'veg',     name:'Vegetables',    ico:'🥦', budget:14},
  {id:'fruit',   name:'Fruit',         ico:'🍓', budget:6},
  {id:'dairy',   name:'Dairy',         ico:'🧀', budget:9},
  {id:'basics',  name:'Basics',        ico:'🧂', budget:3},
  {id:'lazy',    name:'Lazy-day food', ico:'🍜', budget:3},
];
const CAP = CATS.reduce((s,c)=>s+c.budget,0); // 73
const KEY = 'grocery-jar-v1';

let store = {};
try { store = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch(e) { store = {}; }
function save(){ try { localStorage.setItem(KEY, JSON.stringify(store)); } catch(e){} }

// Weeks start on Monday, keyed by that Monday's date (YYYY-MM-DD, local time).
function mondayOf(d){ const x=new Date(d); x.setHours(0,0,0,0); const day=(x.getDay()+6)%7; x.setDate(x.getDate()-day); return x; }
function keyOf(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function fromKey(k){ const [y,m,d]=k.split('-').map(Number); return new Date(y,m-1,d); }
const fmtDay = d => d.toLocaleDateString(undefined,{month:'short',day:'numeric'});
const money = n => '$'+(Math.round(n*100)/100).toLocaleString(undefined,{minimumFractionDigits:0,maximumFractionDigits:2});

const thisMonday = mondayOf(new Date());
let viewMonday = new Date(thisMonday);

function week(k){ if(!store[k]) store[k]={}; return store[k]; }
function items(k,cid){ const w=week(k); if(!w[cid]) w[cid]=[]; return w[cid]; }
function sum(list){ return list.reduce((s,i)=>s+i.amt,0); }
function weekTotal(k){ return CATS.reduce((s,c)=>s+sum(items(k,c.id)),0); }

function barClass(spent,budget){ const r=spent/budget; return r>1?'bad':r>=0.85?'warn':''; }

function render(){
  const k = keyOf(viewMonday);
  const sunday = new Date(viewMonday); sunday.setDate(sunday.getDate()+6);
  const isThis = k===keyOf(thisMonday);
  document.getElementById('weekLabel').textContent = (isThis?'This week · ':'')+fmtDay(viewMonday)+' – '+fmtDay(sunday);
  document.getElementById('nextWeek').disabled = isThis;

  const total = weekTotal(k);
  document.getElementById('spent').textContent = money(total);
  const tb = document.getElementById('totalBar');
  tb.className = 'bar '+barClass(total,CAP);
  tb.firstElementChild.style.width = Math.min(100, total/CAP*100)+'%';
  const left = CAP-total;
  document.getElementById('leftText').textContent = left>=0 ? money(left)+' left in the jar' : money(-left)+' over — gentle reset next week';
  document.getElementById('leftText').className = left<0?'over':'';
  const mood = total===0 ? 'Fresh jar ✨' : left<0 ? 'Oops, over 🫠' : left<CAP*0.15 ? 'Almost full 👀' : 'Doing great 💖';
  document.getElementById('mood').textContent = mood;
  if(isThis){
    const today=new Date(); today.setHours(0,0,0,0);
    const dayN = Math.round((today-thisMonday)/86400000)+1;
    document.getElementById('dayText').textContent = 'Day '+dayN+' of 7';
  } else document.getElementById('dayText').textContent = 'Past week';

  const cats = document.getElementById('cats'); cats.innerHTML='';
  for(const c of CATS){
    const list = items(k,c.id), spent = sum(list), rem = c.budget-spent;
    const el = document.createElement('article'); el.className='cat';
    el.innerHTML = `
      <div class="top">
        <div class="ico" aria-hidden="true">${c.ico}</div>
        <h3>${c.name}</h3>
        <div class="nums ${rem<0?'over':''}">${money(spent)} / ${money(c.budget)}<small>${rem>=0?money(rem)+' left':money(-rem)+' over'}</small></div>
      </div>
      <div class="bar ${barClass(spent,c.budget)}"><i style="width:${Math.min(100,spent/c.budget*100)}%"></i></div>
      <form class="add" data-cat="${c.id}">
        <label class="money"><span hidden>Amount for ${c.name}</span><input class="amt" id="amt-${c.id}" type="number" inputmode="decimal" step="0.01" min="0" placeholder="0.00" required></label>
        <input class="note" id="note-${c.id}" type="text" placeholder="what was it?" maxlength="40" aria-label="Note for ${c.name}">
        <button type="submit">Add</button>
      </form>
      <div class="items"></div>`;
    const chips = el.querySelector('.items');
    list.forEach((it,idx)=>{
      const b=document.createElement('button'); b.type='button'; b.className='chip';
      b.title='Remove'; b.innerHTML = `<b>${money(it.amt)}</b>${it.note?' '+escapeHtml(it.note):''}`;
      b.onclick=()=>{ list.splice(idx,1); save(); render(); };
      chips.appendChild(b);
    });
    el.querySelector('form').onsubmit = e=>{
      e.preventDefault();
      const amtEl=el.querySelector('.amt'), noteEl=el.querySelector('.note');
      const amt=parseFloat(amtEl.value); if(!(amt>0)) return;
      list.push({amt:Math.round(amt*100)/100, note:noteEl.value.trim(), at:Date.now()});
      save(); render();
      document.getElementById('amt-'+c.id)?.focus();
    };
    cats.appendChild(el);
  }
  renderHistory();
}

function escapeHtml(s){ return s.replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

function renderHistory(){
  const keys = Object.keys(store).filter(k=>k<keyOf(thisMonday) && weekTotal(k)>0).sort().reverse();
  const ul=document.getElementById('histList'); ul.innerHTML='';
  document.getElementById('histEmpty').hidden = keys.length>0;
  let streak=0; for(const k of keys){ if(weekTotal(k)<=CAP) streak++; else break; }
  document.getElementById('streak').textContent = keys.length ? (streak ? `${streak} week${streak>1?'s':''} under budget in a row 🎉` : 'Streak reset. This week is a fresh start 🌱') : '';
  for(const k of keys.slice(0,12)){
    const t=weekTotal(k), m=fromKey(k), s=new Date(m); s.setDate(s.getDate()+6);
    const li=document.createElement('li');
    li.innerHTML=`<span>${fmtDay(m)} – ${fmtDay(s)}</span><span class="${t>CAP?'over':''}">${money(t)}</span><span>${t<=CAP?'💚':'🫠'}</span>`;
    li.style.cursor='pointer'; li.title='Open this week';
    li.onclick=()=>{ viewMonday=fromKey(k); render(); window.scrollTo({top:0,behavior:'smooth'}); };
    ul.appendChild(li);
  }
}

document.getElementById('prevWeek').onclick=()=>{ viewMonday.setDate(viewMonday.getDate()-7); render(); };
document.getElementById('nextWeek').onclick=()=>{ if(viewMonday<thisMonday){ viewMonday.setDate(viewMonday.getDate()+7); render(); } };
render();
</script>
